                    { title: "04. 숲 치료(Forest Therapy)가 자율신경계에 미치는 영향", body: "삼림욕 환경은 NK세포(자연살해세포)의 활성도를 높이고 부교감신경계를 활성화합니다. 음향 사운드는 이러한 숲의 생리적 이점을 뇌에 직접 전달합니다." },

    <script>
        let audioCtx = null, binauralOscL = null, binauralOscR = null;
        let gainBinaural = null, gainRain = null, gainFire = null;
        let rainNode = null, fireNode = null, isPlaying = false;

        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            const merg = audioCtx.createChannelMerger(2);
            binauralOscL = audioCtx.createOscillator();
            binauralOscR = audioCtx.createOscillator();
            binauralOscL.frequency.value = 200;
            binauralOscR.frequency.value = 206;

            gainBinaural = audioCtx.createGain();
            binauralOscL.connect(merg, 0, 0);
            binauralOscR.connect(merg, 0, 1);
            merg.connect(gainBinaural);
            gainBinaural.connect(audioCtx.destination);
            binauralOscL.start();
            binauralOscR.start();

            const bufferSize = audioCtx.sampleRate * 2;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
            for (let i = 0; i < bufferSize; i++) {
                let white = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + white * 0.0555179;
                b1 = 0.99332 * b1 + white * 0.0750759;
                b2 = 0.96900 * b2 + white * 0.1538520;
                b3 = 0.86650 * b3 + white * 0.3104856;
                b4 = 0.55000 * b4 + white * 0.5329522;
                b5 = -0.7616 * b5 - white * 0.0168980;
                output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                output[i] *= 0.11;
                b6 = white * 0.115926;
            }
            rainNode = audioCtx.createBufferSource();
            rainNode.buffer = noiseBuffer;
            rainNode.loop = true;
            gainRain = audioCtx.createGain();
            rainNode.connect(gainRain);
            gainRain.connect(audioCtx.destination);
            rainNode.start();

            const brownBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const brownOut = brownBuffer.getChannelData(0);
            let lastOutput = 0.0;
            for (let i = 0; i < bufferSize; i++) {
                let white = Math.random() * 2 - 1;
                brownOut[i] = (lastOutput + (0.02 * white)) / 1.02;
                lastOutput = brownOut[i];
                brownOut[i] *= 3.5;
            }
            fireNode = audioCtx.createBufferSource();
            fireNode.buffer = brownBuffer;
            fireNode.loop = true;
            gainFire = audioCtx.createGain();
            fireNode.connect(gainFire);
            gainFire.connect(audioCtx.destination);
            fireNode.start();

            updateVolume();
        }

        function toggleAudio() {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const btn = document.getElementById('play-toggle');
            if (isPlaying) {
                gainBinaural.gain.setValueAtTime(0, audioCtx.currentTime);
                gainRain.gain.setValueAtTime(0, audioCtx.currentTime);
                gainFire.gain.setValueAtTime(0, audioCtx.currentTime);
                btn.innerText = "▶ 숲속 사운드 재생하기";
                isPlaying = false;
            } else {
                updateVolume();
                btn.innerText = "⏸ 잠시 소리 멈추기";
                isPlaying = true;
            }
        }

        function updateVolume() {
            if (!audioCtx || !isPlaying) return;
            const v1 = document.getElementById('vol-binaural').value / 100;
            const v2 = document.getElementById('vol-rain').value / 100;
            const v3 = document.getElementById('vol-fire').value / 100;

            document.getElementById('vol-binaural-text').innerText = `${Math.round(v1 * 100)}%`;
            document.getElementById('vol-rain-text').innerText = `${Math.round(v2 * 100)}%`;
            document.getElementById('vol-fire-text').innerText = `${Math.round(v3 * 100)}%`;

            gainBinaural.gain.setValueAtTime(v1 * 0.15, audioCtx.currentTime);
            gainRain.gain.setValueAtTime(v2 * 0.2, audioCtx.currentTime);
            gainFire.gain.setValueAtTime(v3 * 0.15, audioCtx.currentTime);
        }

        function setPreset(type) {
            document.querySelectorAll('.btn-grid .btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            const s1 = document.getElementById('vol-binaural');
            const s2 = document.getElementById('vol-rain');
            const s3 = document.getElementById('vol-fire');

            if (type === 'relax') { s1.value = 60; s2.value = 50; s3.value = 20; }
            else if (type === 'burnout') { s1.value = 30; s2.value = 70; s3.value = 60; }
            else if (type === 'focus') { s1.value = 80; s2.value = 20; s3.value = 10; }
            updateVolume();
        }

        document.getElementById('stress-slider').addEventListener('input', e => {
            document.getElementById('stress-val').innerText = `${e.target.value} / 10`;
        });

        function toggleAccordion(button) {
            const item = button.parentElement;
            const content = button.nextElementSibling;
            
            if (item.classList.contains('active')) {
                item.classList.remove('active');
                content.style.maxHeight = null;
            } else {
                document.querySelectorAll('.accordion-item').forEach(i => {
                    i.classList.remove('active');
                    i.querySelector('.accordion-content').style.maxHeight = null;
                });
                item.classList.add('active');
                content.style.maxHeight = content.scrollHeight + "px";
            }
        }

        function openModal(type) {
            const modal = document.getElementById('modal-box');
            const body = document.getElementById('modal-body');
            if(type === 'privacy') body.innerHTML = `<h3>개인정보처리방침</h3><br><p>사용자의 개인정보를 저장하지 않습니다.</p>`;
            else if(type === 'terms') body.innerHTML = `<h3>이용약관</h3><br><p>의료적 목적이 아닌 이완 목적의 서비스입니다.</p>`;
            else if(type === 'contact') body.innerHTML = `<h3>문의하기</h3><br><p>이메일: storytown77@gmail.com</p>`;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-box').style.display = 'none';
        }
    </script>
</body>
</html>
